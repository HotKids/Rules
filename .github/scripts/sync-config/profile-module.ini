#!name=Profile Module
#!desc=General Settings Enhanced
#!category=HotKids
#!arguments=PROXY:🔰 Proxy,DIRECT:🔘 DIRECT,REJECT:⛔️ REJECT
#!arguments-desc=PROXY、DIRECT、REJECT 分别填写所用配置中的代理、直连、拒绝策略名，默认 🔰 Proxy、🔘 DIRECT、⛔️ REJECT。Bogus 同样使用 REJECT 参数。

# 模块差异声明：内容从 Surge/Profile.conf 读取；未列出的 General 项直接覆盖。
# 列表合并可逐项使用 %APPEND% 或 %INSERT%；留空表示直接覆盖源值。
[General]
skip-proxy = %APPEND%
always-real-ip = %APPEND%
force-http-engine-hosts = %APPEND%
hijack-dns = %APPEND%

# 保留 Rule 开头到 Bogus（含）的一段，只排除标准 SSH 端口规则。
[Rule Selection]
end-rule-set = Bogus

# 将主配置策略替换成模块参数；[Proxy] 中的内置动作别名先还原为动作。
[Rule Policy]
🔰 Proxy = {{{PROXY}}}
DIRECT = {{{DIRECT}}}
🚧 AdGuard = {{{REJECT}}}
REJECT = {{{REJECT}}}
REJECT-DROP = {{{REJECT}}}
REJECT-NO-DROP = REJECT-NO-DROP
REJECT-TINYGIF = REJECT-TINYGIF
