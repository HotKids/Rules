name: snell-panel-ci

on:
  push:
    branches: [master]
    paths:
      - 'snell-panel/**'
      - '.github/workflows/snell-panel-ci.yml'
  pull_request:
    paths:
      - 'snell-panel/**'
      - '.github/workflows/snell-panel-ci.yml'

permissions:
  contents: read

concurrency:
  group: snell-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: snell-panel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Ensure ShellCheck is installed
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - run: shellcheck scripts/*.sh deploy.sh update.sh doctor.sh backup.sh restore.sh
