name: 🐳

# 仅手动触发。将指定分支的提交信息统一为 🐳；已完成的历史前缀不重复处理。
# 改写后需重新同步本地副本，现有 PR 的历史基线也可能改变。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 要改写提交信息的分支
        required: true
        default: master

permissions:
  contents: write

concurrency:
  group: push-master
  cancel-in-progress: false
  queue: max

jobs:
  whale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout complete commit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Identify unchanged history prefix
        id: history
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BRANCH" >/dev/null
          python3 - <<'PY'
          import os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          original = git('rev-parse', 'HEAD')
          records = git('log', '--format=%H%x00%B%x00', 'HEAD').split('\0')
          commits = [(records[i].strip(), records[i + 1].strip())
                     for i in range(0, len(records) - 1, 2)]
          boundary = ''
          for sha, message in commits:
              if message == '🐳':
                  # A manually named commit is not proof its ancestors were rewritten.
                  messages = git('log', '--format=%B%x00', sha).split('\0')
                  if all(message.strip() == '🐳' for message in messages if message.strip()):
                      boundary = sha
                      break
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'original={original}\n')
              output.write(f'boundary={boundary}\n')
          print('Preserving completed history prefix.' if boundary else 'No completed prefix; rewriting full history.')
          PY

      - name: Rewrite remaining commit messages
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
          ORIGINAL_SHA: ${{ steps.history.outputs.original }}
          BOUNDARY_SHA: ${{ steps.history.outputs.boundary }}
        run: |
          set -euo pipefail
          if [ "$BOUNDARY_SHA" = "$ORIGINAL_SHA" ]; then
            echo 'All commit messages are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B whale-work
          revision=HEAD
          if [ -n "$BOUNDARY_SHA" ]; then revision="${BOUNDARY_SHA}..HEAD"; fi
          git filter-branch -f --msg-filter 'printf "🐳\n"' -- "$revision"

      - name: Publish only if target branch has not moved
        env:
          BRANCH: ${{ inputs.branch }}
          ORIGINAL_SHA: ${{ steps.history.outputs.original }}
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/${BRANCH}:${ORIGINAL_SHA}" origin "HEAD:refs/heads/${BRANCH}"
