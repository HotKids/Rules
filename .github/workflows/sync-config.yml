name: Sync Config

on:
  push:
    branches: [master]
    paths:
      - 'Surge/Profile.conf' # 跨客户端配置及 Profile 增强模块上游
      - 'Surge/Module/Pannel/*.sgmodule' # 同名 Stash 面板的分类、图标和默认参数上游
      - 'Surge/Module/MTProto.sgmodule' # Stash MTProto 的兼容参数默认值
      # clash.ini 通过 << 内嵌 General.yaml，改它同样要重新生成
      - 'Clash/General.yaml'
      - '.github/scripts/sync-config.py'
      - '.github/scripts/config_sync/**'
      - '.github/scripts/_common.py'
      - '.github/scripts/module_convert.py' # BlockAdsBase 的 MITM CA 同步
      - '.github/workflows/sync-config.yml'
      - '.github/scripts/sync-config.txt'
      - '.github/scripts/sync-config/**'
      - '.github/scripts/validate.py'
      - '.github/scripts/requirements.txt'
      - '.github/scripts/publish-generated.py'
      - '.github/scripts/install-cores.py'
      - '.github/scripts/toolchain.json'
      - '.github/actions/**'
  workflow_dispatch:
  # Sync Rules 使用 GITHUB_TOKEN 提交产物，其 push 不会触发另一个工作流。
  # 等编译产物发布成功，再同步 LAN 的不可变 CDN 地址。
  workflow_run:
    workflows: [Sync Rules, '🐳']
    branches: [master]
    types: [completed]

permissions:
  contents: write

# 与 sync-rules / sync-modules 共用同一组，串行化对 master 的 push，避免并发 push 冲突
concurrency:
  group: push-master
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-runtime
      - uses: ./.github/actions/install-cores
        with:
          tools: sing-box
      - name: Capture generation inputs
        run: python3 .github/scripts/publish-generated.py capture --kind config --state "$RUNNER_TEMP/config-publish.json"

      - name: Run sync script
        run: python3 .github/scripts/sync-config.py

      - name: Validate before publishing
        run: python3 .github/scripts/validate.py

      - name: Validate sing-box config before publishing
        run: sing-box check -c sing-box/config.json

      - name: Publish validated configurations
        run: >-
          python3 .github/scripts/publish-generated.py publish
          --state "$RUNNER_TEMP/config-publish.json"
          --message "chore: sync configurations and Stash panel metadata [auto]"
