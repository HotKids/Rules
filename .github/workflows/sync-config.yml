name: Sync Config

on:
  push:
    branches: [master]
    paths:
      - 'Surge/Profile.conf'
      # clash.ini 通过 << 内嵌 General.yaml，改它同样要重新生成
      - 'Clash/General.yaml'
      - '.github/scripts/sync-config.py'
      - '.github/scripts/config_sync/**'
      - '.github/workflows/sync-config.yml'
      - '.github/scripts/sync-config.txt'
      - '.github/scripts/sync-config/**'
      - '.github/scripts/validate.py'
      - '.github/scripts/requirements.txt'
  workflow_dispatch:
  # Sync Rules 使用 GITHUB_TOKEN 提交产物，其 push 不会触发另一个工作流。
  # 等编译产物发布成功，再同步 LAN 的不可变 CDN 地址。
  workflow_run:
    workflows: [Sync Rules]
    types: [completed]

permissions:
  contents: write

# 与 sync-rules / sync-modules 共用同一组，串行化对 master 的 push，避免并发 push 冲突
concurrency:
  group: push-master
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
      - name: Install validation dependencies
        run: python3 -m pip install -r .github/scripts/requirements.txt

      - name: Run sync script
        run: python3 .github/scripts/sync-config.py

      - name: Validate before publishing
        run: python3 .github/scripts/validate.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Clash/Sample.yaml Clash/Mihomo.yaml Clash/Script/ Surge/Balloon.lcf Quantumult/Sample.conf Surge/Surfboard.conf sing-box/config.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync Profile.conf → Clash / Stash / Loon / QX / Surfboard / sing-box [auto]"
            git push
          fi
