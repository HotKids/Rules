name: Sync Config

on:
  push:
    branches: [master]
    paths:
      - 'Surge/Profile.conf'
      # clash.ini 通过 << 内嵌 General.yaml，改它同样要重新生成
      - 'Clash/General.yaml'
      - '.github/scripts/sync-config.py'
      - '.github/scripts/config_sync/**'
      - '.github/workflows/sync-config.yml'
      - '.github/scripts/sync-config.txt'
      - '.github/scripts/sync-config/**'
      - '.github/scripts/validate.py'
      - '.github/scripts/requirements.txt'
      - '.github/tests/**'
  workflow_dispatch:

permissions:
  contents: write

# 与 sync-rules / sync-modules 共用同一组，串行化对 master 的 push，避免并发 push 冲突
concurrency:
  group: push-master
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - name: Install validation dependencies
        run: python3 -m pip install -r .github/scripts/requirements.txt

      - name: Run sync script
        run: python3 .github/scripts/sync-config.py

      - name: Validate before publishing
        run: python3 .github/scripts/validate.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Clash/Sample.yaml Clash/Mihomo.yaml Clash/Script/ Surge/Balloon.lcf Quantumult/Sample.conf Surge/Surfboard.conf sing-box/config.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync Profile.conf → Clash / Stash / Loon / QX / Surfboard / sing-box [auto]"
            git push
          fi
