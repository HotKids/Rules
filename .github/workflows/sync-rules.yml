name: Sync Rules

on:
  push:
    branches: [master]
    paths:
      - 'Surge/RULE-SET/**'
      - '.github/scripts/sync-rules.txt'
      - '.github/scripts/sync-rules.py'
      - '.github/scripts/module_convert.py'
      - '.github/scripts/qx_convert.py'
      - '.github/scripts/qx_scripts.py'
      - '.github/scripts/qx-runtime.js'
      - '.github/tests/test_qx_*.py'
      - '.github/tests/qx-runtime.cjs'
      - '.github/scripts/_common.py'
      # 编译步骤（.srs / .mrs）改动后立即重编译
      - '.github/workflows/sync-rules.yml'
      - '.github/scripts/validate.py'
      - '.github/scripts/requirements.txt'
      - '.github/scripts/publish-generated.py'
      - '.github/scripts/install-cores.py'
      - '.github/scripts/toolchain.json'
      - '.github/actions/**'
  schedule:
    - cron: '7 16 * * *'   # UTC+8 00:07，与模块同步错峰
  workflow_dispatch:

permissions:
  contents: write

# 与 sync-modules / sync-config 共用同一组，串行化对 master 的 push，避免并发 push 冲突
concurrency:
  group: push-master
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-runtime
      - uses: ./.github/actions/install-cores
        with:
          tools: sing-box mihomo
      - name: Capture generation inputs
        run: python3 .github/scripts/publish-generated.py capture --kind rules --state "$RUNNER_TEMP/rules-publish.json"

      - name: Run sync script
        env:
          SYNC_EVENT_NAME: ${{ github.event_name }}
          SYNC_BASE_SHA: ${{ github.event.before }}
          SYNC_EVENT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/sync-rules.py

      - name: Compile sing-box binary rule-sets (.srs)
        run: |
          set -euo pipefail
          sing-box version
          mkdir -p sing-box/rule-set
          # 源 .json → 二进制 .srs（compile 保留 source 声明的 version）；
          # 任一文件编译失败即让整步失败（while 在管道子 shell 内，需显式 exit）
          find sing-box/source -maxdepth 1 -name '*.json' -print0 | while IFS= read -r -d '' f; do
            stem="$(basename "$f" .json)"
            sing-box rule-set compile --output "sing-box/rule-set/${stem}.srs" "$f" || exit 1
          done
          # 清理孤儿 .srs（对应 source .json 已删除）
          find sing-box/rule-set -maxdepth 1 -name '*.srs' -print0 | while IFS= read -r -d '' s; do
            stem="$(basename "$s" .srs)"
            [ -f "sing-box/source/${stem}.json" ] || rm -f "$s"
          done

      - name: Compile mihomo binary rule-sets (.mrs)
        run: |
          set -euo pipefail
          mihomo -v

          # 扫描 Clash/RuleSet 产物：payload 条目无逗号 → domain / 含 CIDR → ipcidr，
          # classical（带规则类型前缀）跳过；同名 .mrs 与源文件并存，孤儿 .mrs 清理
          python3 - <<'EOF'
          import re, subprocess, sys
          from pathlib import Path

          d = Path("Clash/RuleSet")
          compiled = set()
          for src in sorted([*d.glob("*.yaml"), *d.glob("*.txt")]):
              first = next((l.strip()[2:].strip() for l in src.read_text(encoding="utf-8").splitlines()
                            if l.strip().startswith("- ")), None)
              if first is None or "," in first:
                  continue  # 空文件或 classical（TYPE,value）
              behavior = "ipcidr" if re.match(r"^[0-9a-fA-F:.]+/\d+$", first.strip("'\"")) else "domain"
              out = d / f"{src.stem}.mrs"
              subprocess.run(["mihomo", "convert-ruleset", behavior, "yaml", str(src), str(out)],
                             check=True)
              compiled.add(out.name)
              print(f"  ✓ {out} ({behavior})")
          for orphan in d.glob("*.mrs"):
              if orphan.name not in compiled:
                  orphan.unlink()
                  print(f"  ✗ 删除孤儿 {orphan}")
          EOF

      - name: Validate before publishing
        run: python3 .github/scripts/validate.py

      - name: Publish validated rules
        run: >-
          python3 .github/scripts/publish-generated.py publish
          --state "$RUNNER_TEMP/rules-publish.json"
          --message "chore: sync rules and Surge / Stash modules [auto]"
