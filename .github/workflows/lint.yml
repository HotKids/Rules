name: Lint Scripts

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/workflows/lint.yml'
      - '.github/workflows/sync-*.yml'
      - 'Surge/Profile.conf'
      - 'Surge/RULE-SET/**'
      - 'Surge/Module/Scripts/**'
      - 'Surge/Module/Pannel/**'
      - 'Clash/**'
      - 'sing-box/**'
      - 'Quantumult/**'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/workflows/lint.yml'
      - '.github/workflows/sync-*.yml'
      - 'Surge/Profile.conf'
      - 'Surge/RULE-SET/**'
      - 'Surge/Module/Scripts/**'
      - 'Surge/Module/Pannel/**'
      - 'Clash/**'
      - 'sing-box/**'
      - 'Quantumult/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install validation dependencies
        run: python3 -m pip install -r .github/scripts/requirements.txt
      - name: Regenerate and validate configurations and panels
        run: python3 .github/scripts/validate.py --regenerate

      - name: Validate sing-box full config (sing-box check)
        env:
          SING_BOX_VERSION: "1.12.0"
        run: |
          set -euo pipefail
          url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/sing-box.tgz
          tar -xzf /tmp/sing-box.tgz -C /tmp
          SB="/tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
          "$SB" version
          "$SB" check -c sing-box/config.json
          echo "✓ sing-box/config.json 通过 sing-box check"
