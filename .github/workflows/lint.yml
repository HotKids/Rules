name: Lint Scripts

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - 'Surge/Profile.conf'
      - 'Surge/RULE-SET/**'
      - 'Surge/Module/Scripts/**'
      - 'Surge/Module/Pannel/**'
      - 'Surge/Module/Profile.sgmodule'
      - 'Surge/Module/MTProto.sgmodule'
      - 'Surge/Module/Stash/**'
      - 'Clash/**'
      - 'sing-box/**'
      - 'Quantumult/**'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - 'Surge/Profile.conf'
      - 'Surge/RULE-SET/**'
      - 'Surge/Module/Scripts/**'
      - 'Surge/Module/Pannel/**'
      - 'Surge/Module/Profile.sgmodule'
      - 'Surge/Module/MTProto.sgmodule'
      - 'Surge/Module/Stash/**'
      - 'Clash/**'
      - 'sing-box/**'
      - 'Quantumult/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-runtime
      - uses: ./.github/actions/install-cores
        with:
          tools: sing-box
      - name: Regenerate and validate configurations and panels
        run: python3 .github/scripts/validate.py --regenerate

      - name: Validate sing-box full config (sing-box check)
        run: sing-box check -c sing-box/config.json
