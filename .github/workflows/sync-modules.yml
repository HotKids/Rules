name: Sync Modules

on:
  push:
    branches: [master]
    paths:
      - 'Surge/Module/BlockAds.sgmodule'
      - '.github/workflows/sync-modules.yml'
      - '.github/scripts/sync-modules.txt'
      - '.github/scripts/sync-modules.py'
      - '.github/scripts/_common.py'
      - '.github/scripts/validate.py'
      - '.github/scripts/requirements.txt'
      - '.github/tests/**'
  schedule:
    - cron: '0 16 * * *'   # 每天 UTC 16:00 = UTC+8 00:00
  workflow_dispatch:

permissions:
  contents: write

# 与 sync-rules / sync-config 共用同一组，串行化对 master 的 push，避免并发 push 冲突
concurrency:
  group: push-master
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - name: Install validation dependencies
        run: python3 -m pip install -r .github/scripts/requirements.txt

      - name: Run aggregate script
        run: python3 .github/scripts/sync-modules.py

      - name: Validate before publishing
        run: python3 .github/scripts/validate.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Surge/Module/BlockAds.sgmodule
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync modules [auto]"
            git push
          fi
